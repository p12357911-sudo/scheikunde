<!DOCTYPE html>
<html lang="nl">
<head>
    <title>Duurzaamheid</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-black.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="123school.css">
    <script src="https://www.w3schools.com/lib/w3.js"></script>
    <script src="https://www.w3schools.com/lib/w3data.js"></script>
    <style>
        .question {
            font-weight: bold;
            text-align: left;
        }
        .answers label {
            display: block;
            text-align: left;
        }
    </style>
</head>
<body id="myPage" data-spy="scroll" data-target=".navbar" data-offset="60">
    <!-- Navbar -->
    <div w3-include-html="navbar.html"></div>

    <!-- Question container -->
    <div class="w3-container w3-padding-64 w3-center" id="duurzaamheid">
        <em>Duurzaamheid vragen</em>
        <br><br>
        <div id="quiz"></div>
        <button id="submit" class="w3-button knop-blauw">Controleer nu</button>
        <div id="results" role="status" aria-live="polite"></div>
    </div>

    <!-- Footer -->
    <footer class="w3-container w3-padding-32 w3-theme-d1 w3-center">
        <p>Powered by <a href="https://www.123dakschoon.nl" target="_blank">peter-pan</a></p>
        <div style="position:relative;bottom:100px;z-index:1;" class="w3-tooltip w3-right">
            <span class="w3-text w3-padding w3-teal w3-hide-small">Naar Top</span>
            <a class="w3-button w3-theme" href="#myPage">
                <span class="w3-xlarge"><i class="fa fa-chevron-circle-up"></i></span>
            </a>
        </div>
    </footer>

    <script>
        var myQuestions = [
            {
                question: 'Met welk proces scheid je aardolie in fracties met een verschillend kooktraject?',
                answers: {
                    a: 'Kraken',
                    b: 'Gefractioneerde destillatie',
                    c: 'Polymerisatie',
                    d: 'Reformen'
                },
                correctAnswer: 'b'
            },
            {
                question: 'Wat is het kooktraject van een fractie?',
                answers: {
                    a: 'De chemische samenstelling van de fractie',
                    b: 'Het aantal stappen in het destillatieproces',
                    c: 'De druk waarbij je aardolie destilleert',
                    d: 'De temperaturen waartussen de stoffen in die fractie koken'
                },
                correctAnswer: 'd'
            },
            {
                question: 'Wat betekent duurzaamheid?',
                answers: {
                    a: 'Je zorgt voor wat mensen nu nodig hebben, zonder dat het later voor mensen in de toekomst tekortkomt',
                    b: 'Je recyclet alle gebruikte materialen',
                    c: 'Je laat de economie niet meer groeien',
                    d: 'Je gebruikt zo weinig mogelijk energie'
                },
                correctAnswer: 'a'
            },
            {
                question: 'Hoe kun je bijdragen aan duurzaamheid?',
                answers: {
                    a: 'Meer spullen kopen',
                    b: 'Meer fossiele brandstoffen gebruiken',
                    c: 'Duurzame grondstoffen gebruiken of recyclen',
                    d: 'Technologie vermijden'
                },
                correctAnswer: 'c'
            },
            {
                question: 'Wat zegt de atoomeconomie van een reactie?',
                answers: {
                    a: 'Hoeveel procent van de atomen uit de beginstoffen in het gewenste product terechtkomt',
                    b: 'Hoe snel de reactie verloopt',
                    c: 'Hoeveel energie de reactie kost',
                    d: 'Hoeveel geld de reactie kost'
                },
                correctAnswer: 'a'
            },
            {
                question: 'Waarvan maak je biobrandstoffen?',
                answers: {
                    a: 'Metaalafval',
                    b: 'Kunststof',
                    c: 'Fossiele brandstoffen',
                    d: 'Biomassa (planten en andere stoffen uit levende wezens)'
                },
                correctAnswer: 'd'
            },
            {
                question: 'Welke drie stoffen zijn biobrandstoffen?',
                answers: {
                    a: 'Ethanol, methanol en kerosine',
                    b: 'Bio-ethanol, biodiesel en biogas',
                    c: 'Diesel, benzine en aardgas',
                    d: 'Waterstof, zuurstof en stikstof'
                },
                correctAnswer: 'b'
            },
            {
                question: 'Waarvan maak je biobrandstoffen van de eerste generatie?',
                answers: {
                    a: 'Planten die niet geschikt zijn als voedsel',
                    b: 'Kunststof',
                    c: 'Planten die we ook als voedsel gebruiken, zoals mais en suikerriet',
                    d: 'Landbouwafval'
                },
                correctAnswer: 'c'
            },
            {
                question: 'Waarmee geef je een chemisch productieproces weer?',
                answers: {
                    a: 'Met een structuurformule',
                    b: 'Met een blokschema',
                    c: 'Met een tabel',
                    d: 'Met een grafiek'
                },
                correctAnswer: 'b'
            },
            {
                question: 'Wat betekenen de blokken in een blokschema?',
                answers: {
                    a: 'De richting waarin stoffen stromen',
                    b: 'De temperatuur van het proces',
                    c: 'Een apparaat of stap waarin een reactie of scheiding plaatsvindt',
                    d: 'De hoeveelheid stof die ontstaat'
                },
                correctAnswer: 'c'
            },
            {
                question: 'Wat betekenen de pijlen in een blokschema?',
                answers: {
                    a: 'De hoeveelheid stof die ontstaat',
                    b: 'De temperatuur van het proces',
                    c: 'Een apparaat of stap waarin een reactie of scheiding plaatsvindt',
                    d: 'De richting waarin stoffen stromen'
                },
                correctAnswer: 'd'
            },
            {
                question: 'Wat is het molair volume?',
                answers: {
                    a: 'Het volume van 1,00 mol gas bij een bepaalde temperatuur en druk',
                    b: 'De massa van 1,00 mol gas',
                    c: 'Het aantal moleculen in 1,00 mol gas',
                    d: 'De druk van 1,00 mol gas'
                },
                correctAnswer: 'a'
            },
            {
                question: 'Welke grootheid hoort bij het symbool V<sub>m</sub>?',
                answers: {
                    a: 'De dichtheid van een gas',
                    b: 'Het molair volume',
                    c: 'Het aantal mol',
                    d: 'De molaire massa'
                },
                correctAnswer: 'b'
            }
        ];

        var quizContainer = document.getElementById('quiz');
        var resultsContainer = document.getElementById('results');
        var submitButton = document.getElementById('submit');

        generateQuiz(myQuestions, quizContainer, resultsContainer, submitButton);

        function generateQuiz(questions, quizContainer, resultsContainer, submitButton) {
            function showQuestions(questions, quizContainer) {
                var output = [];
                var answers;

                for (var i = 0; i < questions.length; i++) {
                    answers = [];
                    for (var letter in questions[i].answers) {
                        answers.push(
                            '<label>' +
                            '<input type="radio" name="question' + i + '" value="' + letter + '">' +
                            letter + ': ' +
                            questions[i].answers[letter] +
                            '</br></label>'
                        );
                    }
                    output.push(
                        '<div class="question">' + questions[i].question + '</div>' +
                        '<div class="answers">' + answers.join('') + '</div>'
                    );
                }
                quizContainer.innerHTML = output.join('');
            }

            function showResults(questions, quizContainer, resultsContainer) {
                var answerContainers = quizContainer.querySelectorAll('.answers');
                var userAnswer = '';
                var numCorrect = 0;

                for (var i = 0; i < questions.length; i++) {
                    userAnswer = (answerContainers[i].querySelector('input[name=question' + i + ']:checked') || {}).value;

                    if (userAnswer === questions[i].correctAnswer) {
                        numCorrect++;
                        answerContainers[i].style.color = '#14532d';
				markeer(answerContainers[i], true);
                    } else {
                        answerContainers[i].style.color = '#7f1d1d';
				markeer(answerContainers[i], false);
                    }
                }

                resultsContainer.innerHTML = numCorrect + ' van de ' + questions.length + ' goed';
            }

            showQuestions(questions, quizContainer);

            submitButton.onclick = function () {
                showResults(questions, quizContainer, resultsContainer);
            }
        }
    </script>

    <!-- Include functionality to load external page material -->
    <script>
        w3IncludeHTML();
    </script>
<script src="school.js"></script>
</body>
</html>
